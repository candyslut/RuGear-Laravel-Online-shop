<!doctype html>
<html class="no-js" lang="ru">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="x-ua-compatible" content="ie=edge">
        <title>RuGear — Мини-игра</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
        <link href="https://fonts.googleapis.com/css?family=Oswald" rel="stylesheet">
        <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN" crossorigin="anonymous">
        <link rel="stylesheet" href="css/basic.css">
        <link rel="stylesheet" href="css/game.css">
    </head>
    <body>
        <!--[if lte IE 9]>
            <p class="browserupgrade">Вы используете <strong>устаревший</strong> браузер. Пожалуйста, <a href="https://browsehappy.com/">обновите браузер</a> для улучшения безопасности и удобства.</p>
        <![endif]-->
        <div id="wrapper">
            <div id="buzzwordBlast">
                <div class="gameContainer">
                    <div id="screens">
                        <div id="game-title">BUZZWORD BLAST</div>
                        <div id="overlay-start" class="screen-overlay">
                            <p>СТРЕЛКИ — УПРАВЛЕНИЕ</p>
                            <p>ПРОБЕЛ — ОГОНЬ</p>
                            <p>НАЖМИТЕ ЗДЕСЬ ДЛЯ СТАРТА</p>
                        </div>
                        <div id="overlay-win" class="screen-overlay">ВЫ СПРАВИЛИСЬ!</div>
                        <div id="overlay-loss" class="screen-overlay">ЕЩЁ РАЗ!</div>
                        <div id="continue" class="space-btn">ПРОБЕЛ — ПРОДОЛЖИТЬ</div>
                        <div id="restart" class="space-btn">ПРОБЕЛ — СНОВА</div>
                    </div>
                    <canvas id="game" width="700" height="700"></canvas>
                    <div id="gameVars" class="endscreen">
                        <div id="numships">Корабли: <span></span></div>
                        <div id="playerscore">Счёт: <span></span></div>
                        
                    </div>
                    <div id="soundcontrol">
                        <div id="musicState" class="controllingitem"><i class="fa fa-music"></i><div class="times">&times;</div></div>
                        <div id="soundState" class="controllingitem"><i class="fa fa-volume-down"></i><div class="times">&times;</div></div>
                    </div>
                </div>
            </div>

            <div id="touch-controls" aria-hidden="true">
                <div class="tc-cluster tc-cluster--left">
                    <button type="button" class="tc-btn" data-key="left" aria-label="Поворот влево">
                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15 5l-7 7 7 7z"/></svg>
                    </button>
                    <button type="button" class="tc-btn" data-key="right" aria-label="Поворот вправо">
                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 5l7 7-7 7z"/></svg>
                    </button>
                </div>
                <div class="tc-cluster tc-cluster--right">
                    <button type="button" class="tc-btn" data-key="up" aria-label="Ускорение">
                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 7l7 10H5z"/></svg>
                    </button>
                    <button type="button" class="tc-btn tc-btn--fire" data-key="space" aria-label="Огонь">
                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="7"/></svg>
                    </button>
                </div>
            </div>

        </div>

        <script src="https://code.jquery.com/jquery-3.2.1.min.js" integrity="sha256-hwg4gsxgFZhOsEEamdOYGBf13FyQuiTwlAQgxVSNgt4=" crossorigin="anonymous"></script>
        <script>window.jQuery || document.write('<script src="js/jquery-3.2.1.min.js"><\/script>')</script>
        <script src="js/game.js?v=20260611b"></script>
        <script>
            $(document).ready(function() {
                window.yodorada.buzzwordBlast();
            });
        </script>
    </body>
</html>
